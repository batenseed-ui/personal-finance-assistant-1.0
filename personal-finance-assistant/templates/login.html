<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in - Personal Finance Assistant</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1b1f24; --muted: #5c6670; --line: #cfd6de;
    --accent: #1b5fd1; --accent-text: #ffffff; --danger: #b42318; --ok: #067647;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1317; --card: #171c22; --text: #e8ecf0; --muted: #9aa5b1; --line: #2d3640;
      --accent: #5b94ff; --accent-text: #0b1220; --danger: #ff8f85; --ok: #6ee7b7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 28px 24px;
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: .95rem; }
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--line); }
  .tabs button {
    flex: 1; padding: 10px 0; background: none; border: 0; border-bottom: 3px solid transparent;
    color: var(--muted); font: inherit; font-weight: 600; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
  form[hidden] { display: none; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: .92rem; }
  input[type="text"], input[type="password"] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[aria-invalid="true"] { border-color: var(--danger); }
  .hint { margin: 4px 0 0; color: var(--muted); font-size: .85rem; }
  .field-error { margin: 4px 0 0; color: var(--danger); font-size: .88rem; min-height: 0; }
  .show { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; font-weight: 400; font-size: .9rem; color: var(--muted); }
  .submit {
    width: 100%; margin-top: 20px; padding: 12px; font: inherit; font-weight: 700; cursor: pointer;
    color: var(--accent-text); background: var(--accent); border: 0; border-radius: 8px;
  }
  .submit[disabled] { opacity: .6; cursor: progress; }
  .msg { margin: 14px 0 0; font-size: .95rem; }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .note { margin: 20px 0 0; color: var(--muted); font-size: .82rem; }
</style>
</head>
<body>
<main class="card">
  <h1>Personal Finance Assistant</h1>
  <p class="sub">Log in to see your finances. Your saved results are private to your account.</p>

  <div class="tabs" role="tablist" aria-label="Account">
    <button type="button" role="tab" id="tab-login" aria-selected="true" aria-controls="form-login">Log in</button>
    <button type="button" role="tab" id="tab-register" aria-selected="false" aria-controls="form-register">Create account</button>
  </div>

  <form id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
    <label for="login-username">Username</label>
    <input id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>

    <label for="login-password">Password</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
    <label class="show"><input type="checkbox" data-show-password> Show password</label>

    <button class="submit" type="submit">Log in</button>
    <p class="msg" role="alert" data-message></p>
  </form>

  <form id="form-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
    <label for="register-username">Username</label>
    <input id="register-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <p class="hint">3-32 characters: letters, numbers, dot, dash or underscore.</p>
    <p class="field-error" data-error-for="username"></p>

    <label for="register-password">Password</label>
    <input id="register-password" name="password" type="password" autocomplete="new-password" required>
    <p class="hint">At least 8 characters.</p>
    <p class="field-error" data-error-for="password"></p>

    <label for="register-confirm">Confirm password</label>
    <input id="register-confirm" name="confirm" type="password" autocomplete="new-password" required>
    <p class="field-error" data-error-for="confirm"></p>
    <label class="show"><input type="checkbox" data-show-password> Show passwords</label>

    <button class="submit" type="submit">Create account</button>
    <p class="msg" role="alert" data-message></p>
  </form>

  <p class="note">Passwords are stored only as salted hashes. Nothing here is financial advice.</p>
</main>

<script>
(function () {
  "use strict";

  var popup = new URLSearchParams(window.location.search).get("popup") === "1";
  var forms = {
    login: document.getElementById("form-login"),
    register: document.getElementById("form-register")
  };
  var tabs = {
    login: document.getElementById("tab-login"),
    register: document.getElementById("tab-register")
  };

  function showTab(which) {
    Object.keys(forms).forEach(function (name) {
      var active = name === which;
      forms[name].hidden = !active;
      tabs[name].setAttribute("aria-selected", active ? "true" : "false");
    });
    forms[which].querySelector("input").focus();
  }
  tabs.login.addEventListener("click", function () { showTab("login"); });
  tabs.register.addEventListener("click", function () { showTab("register"); });

  Array.prototype.forEach.call(document.querySelectorAll("[data-show-password]"), function (box) {
    box.addEventListener("change", function () {
      var form = box.closest("form");
      Array.prototype.forEach.call(form.querySelectorAll('input[name="password"], input[name="confirm"]'), function (input) {
        input.type = box.checked ? "text" : "password";
      });
    });
  });

  function setMessage(form, text, kind) {
    var el = form.querySelector("[data-message]");
    el.textContent = text || "";
    el.className = "msg" + (kind ? " " + kind : "");
  }

  function setFieldError(form, name, text) {
    var input = form.querySelector('input[name="' + name + '"]');
    var holder = form.querySelector('[data-error-for="' + name + '"]');
    if (input) { input.setAttribute("aria-invalid", text ? "true" : "false"); }
    if (holder) { holder.textContent = text || ""; }
  }

  function clearErrors(form) {
    setMessage(form, "");
    ["username", "password", "confirm"].forEach(function (name) { setFieldError(form, name, ""); });
  }

  async function postJson(url, body) {
    var response;
    try {
      response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify(body)
      });
    } catch (err) {
      return { networkError: true };
    }
    var data = {};
    try { data = await response.json(); } catch (err) { /* non-JSON error page */ }
    return { status: response.status, ok: response.ok && data.ok === true, data: data };
  }

  function signedIn(form) {
    if (popup) {
      setMessage(form, "Signed in. You can close this tab and go back to your analysis.", "ok");
      return;
    }
    window.location.replace("/");
  }

  async function handle(form, url, body, afterFail) {
    var button = form.querySelector(".submit");
    clearErrors(form);
    button.disabled = true;
    var result = await postJson(url, body);
    button.disabled = false;   // inputs are never cleared, so nothing the user typed is lost

    if (result.networkError) {
      setMessage(form, "Could not reach the server. Check your connection and try again.", "error");
      return;
    }
    if (result.ok) { signedIn(form); return; }

    var data = result.data || {};
    var fieldErrors = data.field_errors || {};
    Object.keys(fieldErrors).forEach(function (name) { setFieldError(form, name, fieldErrors[name]); });
    if (!Object.keys(fieldErrors).length) {
      setMessage(form, data.error || "Something went wrong. Please try again.", "error");
    } else if (data.error && result.status !== 400) {
      setMessage(form, data.error, "error");
    }
    if (afterFail) { afterFail(result); }
  }

  forms.login.addEventListener("submit", function (event) {
    event.preventDefault();
    handle(forms.login, "/api/login", {
      username: forms.login.elements.username.value,
      password: forms.login.elements.password.value
    }, function () { forms.login.elements.password.focus(); forms.login.elements.password.select(); });
  });

  forms.register.addEventListener("submit", function (event) {
    event.preventDefault();
    var form = forms.register;
    var password = form.elements.password.value;
    if (password !== form.elements.confirm.value) {
      clearErrors(form);
      setFieldError(form, "confirm", "The two passwords do not match.");
      return;
    }
    handle(form, "/api/register", {
      username: form.elements.username.value,
      password: password
    });
  });

  forms.login.elements.username.focus();
})();
</script>
</body>
</html>
